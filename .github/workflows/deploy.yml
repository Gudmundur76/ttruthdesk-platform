name: Publish to Manus on Push
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    name: Trigger Manus website.publish
    needs: []
    steps:
      - name: Publish ttruthdesk-platform to Manus
        run: |
          RESPONSE=$(curl -s -X POST "https://api.manus.ai/v2/website.publish" \
            -H "x-manus-api-key: ${{ secrets.MANUS_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"website_id":"5R5rZPYgTj2s3EMJSc7MVm","visibility":"public"}')
          echo "Response: $RESPONSE"
          OK=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ok','false'))")
          if [ "$OK" != "True" ]; then
            echo "Publish failed: $RESPONSE"
            exit 1
          fi
          echo "✅ Manus publish triggered successfully"
          VERSION=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('version_id','unknown'))")
          echo "Version: $VERSION"
      - name: Poll publish status
        run: |
          echo "Polling publish status..."
          for i in $(seq 1 18); do
            sleep 10
            STATUS=$(curl -s "https://api.manus.ai/v2/website.status?website_id=5R5rZPYgTj2s3EMJSc7MVm" \
              -H "x-manus-api-key: ${{ secrets.MANUS_API_KEY }}" | \
              python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('publish_status','unknown'))")
            echo "  Attempt $i: $STATUS"
            if [ "$STATUS" = "published" ]; then
              echo "✅ Published successfully at https://citation.manus.space"
              exit 0
            fi
            if [ "$STATUS" = "failed" ]; then
              echo "❌ Publish failed"
              exit 1
            fi
          done
          echo "⚠️ Timed out waiting for publish — check Manus dashboard"
