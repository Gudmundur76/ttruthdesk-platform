name: Inspect VPS Routing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect citation.is Nginx routing and ttruthdesk service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            echo '=== remote execution context ==='
            echo "shell=$0"
            whoami
            id
            command -v sudo
            sudo -n true && echo 'passwordless sudo=available'
            test -f /data/coolify/proxy/dynamic/ttruthdesk-routing.yaml && echo 'routing file=present'
            sudo test -r /data/coolify/proxy/dynamic/ttruthdesk-routing.yaml && echo 'routing file=readable'
            sudo test -w /data/coolify/proxy/dynamic/ttruthdesk-routing.yaml && echo 'routing file=writable'
            sudo sh -c 'echo privileged shell=working'
            echo '=== ttruthdesk service ==='
            sudo systemctl is-active ttruthdesk.service
            sudo systemctl show ttruthdesk.service --property=ActiveState --property=SubState --no-pager
            echo '=== citation.is Nginx configuration files ==='
            sudo grep -RslE 'server_name.*(citation\\.is|api\\.citation\\.is)' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true
            for conf in $(sudo grep -RslE 'server_name.*(citation\\.is|api\\.citation\\.is)' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true); do
              echo "=== BEGIN ${conf} ==="
              sudo sed -n '1,260p' "${conf}"
              echo "=== END ${conf} ==="
            done
            echo '=== proxy runtime ==='
            if command -v nginx >/dev/null 2>&1; then
              sudo nginx -t
            else
              echo 'nginx is not installed; inspecting Docker/Traefik instead.'
              sudo docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
              echo '=== Traefik dynamic configuration files ==='
              sudo find /data/coolify/proxy /etc/traefik /opt/coolify -maxdepth 4 -type f \
                \( -name '*.yml' -o -name '*.yaml' -o -name '*.toml' \) 2>/dev/null | while read -r conf; do
                if sudo grep -Eq 'citation\.is|api\.citation\.is|3001' "${conf}"; then
                  echo "=== BEGIN ${conf} ==="
                  sudo sed -n '1,320p' "${conf}"
                  echo "=== END ${conf} ==="
                fi
              done
              echo '=== ttruthdesk service definition ==='
              sudo systemctl cat ttruthdesk.service
              echo '=== ttruthdesk public-origin environment ==='
              sudo systemctl show ttruthdesk.service --property=Environment --no-pager | \
                tr ' ' '\n' | grep -E 'VITE_APP_URL|APP_URL|SITE_ORIGIN' || true
              echo '=== containers with Traefik or citation.is labels ==='
              for container in $(sudo docker ps -q); do
                labels=$(sudo docker inspect -f '{{range $key,$value := .Config.Labels}}{{$key}}={{$value}}{{"\n"}}{{end}}' "${container}")
                if echo "${labels}" | grep -Eqi 'traefik|citation\.is'; then
                  echo "--- $(sudo docker inspect -f '{{.Name}}' "${container}") ---"
                  echo "${labels}" | grep -Ei 'traefik|citation\.is' || true
                fi
              done
            fi
