name: Inspect VPS Routing

on:
  workflow_dispatch:
    inputs:
      apply_main_domain_routing:
        description: Apply the citation.is → ttruthdesk API routing change
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      apply_ingestion_schema_repair:
        description: Back up and repair the live auto_ingested_papers pmid column
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect citation.is proxy routing and ttruthdesk service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            echo '=== remote execution context ==='
            echo "shell=$0"
            whoami
            id
            command -v sudo
            sudo -n true && echo 'passwordless sudo=available'
            test -f /data/coolify/proxy/dynamic/ttruthdesk-routing.yaml && echo 'routing file=present'
            sudo test -r /data/coolify/proxy/dynamic/ttruthdesk-routing.yaml && echo 'routing file=readable'
            sudo test -w /data/coolify/proxy/dynamic/ttruthdesk-routing.yaml && echo 'routing file=writable'
            sudo sh -c 'echo privileged shell=working'
            echo '=== ttruthdesk service ==='
            sudo systemctl is-active ttruthdesk.service
            sudo systemctl show ttruthdesk.service --property=ActiveState --property=SubState --no-pager
            echo '=== citation.is proxy configuration ==='
            sudo sed -n '1,220p' /data/coolify/proxy/dynamic/ttruthdesk-routing.yaml
            echo '=== ttruthdesk public-origin environment ==='
            sudo grep -E '^VITE_APP_URL=' ~/ttruthdesk-platform/.env || true
            echo '=== local HTTPS port owner ==='
            sudo ss -ltnp '( sport = :443 )' || true
            echo '=== local Traefik citation.is response ==='
            curl -ksS -D - --resolve citation.is:443:127.0.0.1 https://citation.is/api/v2/health/detailed -o /tmp/citation-local-body.txt || true
            head -c 1200 /tmp/citation-local-body.txt; echo
            echo '=== Traefik upstream reachability ==='
            sudo docker exec coolify-proxy getent hosts host.docker.internal || true
            sudo docker exec coolify-proxy sh -c 'wget -S -O- -T 10 http://host.docker.internal:3001/api/v2/health/detailed 2>&1 | head -30' || true
            sudo docker exec coolify-proxy sh -c 'wget -S -O- -T 10 http://172.17.0.1:3001/api/v2/health/detailed 2>&1 | head -30' || true
            sudo docker exec coolify-proxy sh -c 'wget -S -O- -T 10 http://10.0.1.1:3001/api/v2/health/detailed 2>&1 | head -30' || true
            sudo docker exec coolify-proxy sh -c 'wget -S -O- -T 10 http://187.124.213.194:3001/api/v2/health/detailed 2>&1 | head -30' || true
            echo '=== Traefik container host mapping ==='
            sudo docker inspect coolify-proxy --format '{{json .HostConfig.ExtraHosts}} {{json .NetworkSettings.Networks}}'
            echo '=== ttruthdesk listener binding ==='
            sudo ss -ltnp '( sport = :3001 )' || true
            sudo grep -E '^(HOST|PORT|VITE_APP_URL)=' ~/ttruthdesk-platform/.env || true
            echo '=== host-side reachability ==='
            curl -sS -m 8 -o /dev/null -w '127.0.0.1:%{http_code}\n' http://127.0.0.1:3001/api/v2/health/detailed || true
            curl -sS -m 8 -o /dev/null -w '10.0.0.1:%{http_code}\n' http://10.0.0.1:3001/api/v2/health/detailed || true
            echo '=== detailed local health response ==='
            curl -sS -i -m 12 http://127.0.0.1:3001/api/v2/health/detailed || true
            echo '=== live auto_ingested_papers schema ==='
            cd ~/ttruthdesk-platform
            node -e 'require("dotenv").config(); const mysql=require("mysql2/promise"); (async()=>{const c=await mysql.createConnection(process.env.DATABASE_URL); const [rows]=await c.query("SHOW COLUMNS FROM auto_ingested_papers"); console.log(JSON.stringify(rows.map(r=>({Field:r.Field,Type:r.Type,Null:r.Null,Key:r.Key,Default:r.Default})),null,2)); await c.end();})().catch(e=>{console.error(e.message);process.exit(1);});' || true
            echo '=== recent ttruthdesk logs ==='
            sudo journalctl -u ttruthdesk.service -n 80 --no-pager || true

  route-main-domain:
    if: ${{ inputs.apply_main_domain_routing == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Route citation.is to ttruthdesk API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          command_timeout: 15m
          script: |
            set -e
            echo '=== Updating citation.is route ==='
            sudo cp /data/coolify/proxy/dynamic/ttruthdesk-routing.yaml /data/coolify/proxy/dynamic/ttruthdesk-routing.yaml.bak
            sudo sed -i 's/service: citation-desk/service: ttruthdesk-platform/g' /data/coolify/proxy/dynamic/ttruthdesk-routing.yaml
            sudo grep -A16 '^    citation-http:' /data/coolify/proxy/dynamic/ttruthdesk-routing.yaml
            echo '=== Setting canonical origin ==='
            if sudo grep -q '^VITE_APP_URL=' ~/ttruthdesk-platform/.env; then
              sudo sed -i 's|^VITE_APP_URL=.*|VITE_APP_URL=https://citation.is|' ~/ttruthdesk-platform/.env
            else
              echo 'VITE_APP_URL=https://citation.is' | sudo tee -a ~/ttruthdesk-platform/.env >/dev/null
            fi
            echo '=== Building and restarting ttruthdesk ==='
            cd ~/ttruthdesk-platform
            pnpm install --frozen-lockfile
            pnpm run build
            sudo systemctl restart ttruthdesk.service
            sudo systemctl is-active ttruthdesk.service
            echo '=== Reloading Traefik ==='
            sudo docker restart coolify-proxy
            sleep 8
            echo '=== Local endpoint verification ==='
            curl -fsS --resolve citation.is:443:127.0.0.1 https://citation.is/api/v2/health/detailed
            echo


  repair-ingestion-schema:
    if: ${{ inputs.apply_ingestion_schema_repair == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Back up and repair auto_ingested_papers pmid schema
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd ~/ttruthdesk-platform
            echo '=== Backing up and migrating auto_ingested_papers ==='
            node -e 'const fs=require("fs"); require("dotenv").config(); const mysql=require("mysql2/promise"); (async()=>{const db=await mysql.createConnection(process.env.DATABASE_URL); const [[col]]=await db.query("SHOW COLUMNS FROM auto_ingested_papers LIKE \"pmid\""); const [[ddl]]=await db.query("SHOW CREATE TABLE auto_ingested_papers"); const [rows]=await db.query("SELECT * FROM auto_ingested_papers"); const stamp=new Date().toISOString().replace(/[:.]/g,"-"); fs.mkdirSync("backups",{recursive:true}); const backup=`backups/auto_ingested_papers-${stamp}.json`; fs.writeFileSync(backup,JSON.stringify({capturedAt:new Date().toISOString(),schema:ddl,rows},null,2)); if(!col)throw new Error("pmid column not found"); if(col.Type==="varchar(32)")await db.query("ALTER TABLE auto_ingested_papers MODIFY COLUMN pmid varchar(128) NOT NULL"); else if(col.Type!=="varchar(128)")throw new Error(`unexpected pmid type ${col.Type}`); const [[verified]]=await db.query("SHOW COLUMNS FROM auto_ingested_papers LIKE \"pmid\""); console.log(JSON.stringify({backup,previousType:col.Type,currentType:verified.Type,rowCount:rows.length})); await db.end();})().catch(e=>{console.error(e.stack||e.message);process.exit(1);});'
            echo '=== Restarting ttruthdesk after schema repair ==='
            sudo systemctl restart ttruthdesk.service
            sleep 6
            curl -fsS http://127.0.0.1:3001/api/v2/health/detailed
            echo
