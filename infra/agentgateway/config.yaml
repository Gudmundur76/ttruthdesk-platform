# agentgateway v1.2.1 — citation.is MCP proxy
# SSE endpoint: https://ttruthdesk.claims/mcp (returns text/event-stream)
# JSON-RPC endpoint: https://ttruthdesk.claims/api/mcp (returns application/json)
binds:
- port: 3000
  listeners:
  - routes:
    - backends:
      - mcp:
          targets:
          - name: citation-is-mcp
            sse:
              host: ttruthdesk.claims
              port: 443
              path: /mcp
            policies:
              backendTLS:
                hostname: ttruthdesk.claims
      policies:
        cors:
          allowOrigins:
          - "*"
          allowHeaders:
          - mcp-protocol-version
          - content-type
          - cache-control
          - mcp-session-id
          exposeHeaders:
          - "Mcp-Session-Id"
