# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# agentgateway v1.2.1 — citation.is MCP proxy config
# https://agentgateway.dev/docs/standalone/
#
# Run: agentgateway -f infra/agentgateway/config.yaml
# MCP endpoint: http://localhost:3000/mcp
# Admin UI:     http://localhost:15000/ui/
binds:
- port: 3000
  listeners:
  - routes:
    - backends:
      - mcp:
          targets:
          - name: citation-is-mcp
            sse:
              host: citation.is
              port: 443
              path: /mcp
            policies:
              backendTLS:
                hostname: citation.is
      policies:
        cors:
          allowOrigins:
          - "*"
          allowHeaders:
          - mcp-protocol-version
          - content-type
          - cache-control
          - mcp-session-id
          exposeHeaders:
          - "Mcp-Session-Id"
